<!doctype html>
<html><head><meta charset="utf-8"><base href="/"><title>ski raw axes</title>
<style>html,body{margin:0;background:#dfe6ee;font:600 14px system-ui}.l{position:absolute;color:#123;background:#ffffffcc;padding:2px 6px}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// Dev harness: each shop ski model in its OWN file axes. Left cell: side view (screen right = +X, up = +Y).
// Right cell: top view from +Y (screen right = +X, screen up = -Z). Used to set per-model tip/up overrides.
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js';
import { SKIS } from '/src/game/economy.js';
const CW = 800, CH = 170, W = CW * 2, H = CH * SKIS.length;
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
r.setSize(W, H); r.setClearColor('#dfe6ee'); r.setScissorTest(true);
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
const half = 1.1, vh = half * CH / CW;
// load everything first, then draw all cells in one frame (the canvas is cleared between frames)
const gltfs = await Promise.all(SKIS.map((s) => loader.loadAsync(`models/${s.model}.glb`).catch(() => loader.loadAsync(`models/${s.fallback}.glb`))));
for (let i = 0; i < SKIS.length; i++) {
  const s = SKIS[i], gltf = gltfs[i];
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight('#ffffff', '#556677', 2.4));
  const d = new THREE.DirectionalLight('#ffffff', 1.6); d.position.set(1, 3, 2); scene.add(d);
  const box = new THREE.Box3().setFromObject(gltf.scene), c = box.getCenter(new THREE.Vector3());
  const k = 2 / (box.max.x - box.min.x);
  gltf.scene.scale.setScalar(k); gltf.scene.position.copy(c).multiplyScalar(-k);
  scene.add(gltf.scene);
  const axes = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(0.9, 0, 0), 0.25, 0xff2200, 0.08, 0.05); scene.add(axes);
  const side = new THREE.OrthographicCamera(-half, half, vh, -vh, 0.1, 50); side.position.set(0, 0, 10); side.lookAt(0, 0, 0);
  const top = new THREE.OrthographicCamera(-half, half, vh, -vh, 0.1, 50); top.up.set(0, 0, -1); top.position.set(0, 10, 0); top.lookAt(0, 0, 0);
  const y = H - (i + 1) * CH;
  for (const [cam, x] of [[side, 0], [top, CW]]) { r.setViewport(x, y, CW, CH); r.setScissor(x, y, CW, CH); r.render(scene, cam); }
  const l = document.createElement('div'); l.className = 'l'; l.style.left = '4px'; l.style.top = (i * CH + 2) + 'px';
  l.textContent = `${i} ${s.model}: SIDE (+Y up)  |  TOP (from +Y)   red arrow = +X`; document.body.appendChild(l);
}
window.__done = true;
</script></body></html>
